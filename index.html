<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="description" content="AIFERMA — от реальных задач к решениям с AI.">
  <title>AIFERMA</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f4f6f2; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: radial-gradient(ellipse at 18% 20%, #dde9e1 0, transparent 52%), radial-gradient(ellipse at 85% 82%, #eee8cd 0, transparent 48%), #f4f6f2; }
    main { width: min(100%, 480px); }
    img { display: block; width: 100%; height: auto; border-radius: 50%; box-shadow: 0 24px 80px #203b2e12; }
    @media (max-width: 480px) { body { padding: 36px; } }
  </style>
</head>
<body>
  <main aria-label="AIFERMA"><img src="logo.png" alt="FERMA AI — логотип" width="1254" height="1254"></main>
</body>
</html>

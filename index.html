<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="description" content="AIFERMA — от реальных задач к решениям с AI.">
  <title>AIFERMA</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html { width: 100%; height: 100%; overflow: clip; background: #f4f6f2; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: radial-gradient(ellipse at 18% 20%, #dde9e1 0, transparent 52%), radial-gradient(ellipse at 85% 82%, #eee8cd 0, transparent 48%), #f4f6f2; }
    main { position: relative; isolation: isolate; width: min(480px, calc(100vw - 72px), calc(100svh - 72px)); aspect-ratio: 1; flex: none; }
    .sunshine { position: absolute; inset: -18%; z-index: -1; border-radius: 50%; pointer-events: none; opacity: 0; background: radial-gradient(circle, #efd46c99 20%, #d7bc57a6 42%, #5aaf7b66 55%, #397c8952 64%, transparent 73%); filter: blur(18px); }
    .sunshine::after { content: ''; position: absolute; inset: -5%; border-radius: inherit; background: repeating-conic-gradient(from 8deg, #e8c75a00 0deg, #e8c75aaa 5deg, #6caa7d66 10deg, #397c8933 13deg, transparent 18deg, transparent 24deg); mask-image: radial-gradient(circle, transparent 35%, #000 48%, #0008 60%, transparent 72%); filter: blur(7px); }
    body { position: fixed; inset: 0; width: 100%; height: 100%; min-height: 0; overflow: clip; contain: layout paint; }
    .logo { display: block; width: 100%; height: 100%; aspect-ratio: 1; transform: rotate(0deg) scale(1); padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .logo:focus-visible { outline: 3px solid #407d59; outline-offset: 10px; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; border-radius: 50%; box-shadow: 0 24px 80px #203b2e12; }
    @media (max-width: 480px) { body { padding: 36px; } }
  </style>
</head>
<body>
  <main aria-label="AIFERMA"><span class="sunshine" aria-hidden="true"></span><button class="logo" type="button" aria-label="Вращать логотип FERMA AI"><img src="logo.png" alt="FERMA AI — логотип" width="1254" height="1254" draggable="false"></button></main>
  <script>
    const logo = document.querySelector('.logo');
    const sunshine = document.querySelector('.sunshine');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let spinning = false;
    logo.addEventListener('click', async () => {
      if (spinning) return;
      spinning = true;
      const frames = reducedMotion.matches
        ? [{ opacity: 1 }, { opacity: .75 }, { opacity: 1 }]
        : [
            { transform: 'rotate(0deg) scale(1)', offset: 0 },
            { transform: 'rotate(-12deg) scale(.96)', offset: .12 },
            { transform: 'rotate(180deg) scale(1.04)', offset: .52 },
            { transform: 'rotate(364deg) scale(1.01)', offset: .88 },
            { transform: 'rotate(360deg) scale(1)', offset: 1 }
          ];
      const glow = sunshine.animate([
        { opacity: 0, transform: 'scale(.86) rotate(0deg)', offset: 0 },
        { opacity: .8, transform: 'scale(1) rotate(8deg)', offset: .22 },
        { opacity: 1, transform: 'scale(1.07) rotate(20deg)', offset: .52 },
        { opacity: .65, transform: 'scale(1.03) rotate(30deg)', offset: .8 },
        { opacity: 0, transform: 'scale(.98) rotate(36deg)', offset: 1 }
      ], { duration: reducedMotion.matches ? 240 : 2100, easing: 'ease-in-out' });
      try {
        await Promise.all([logo.animate(frames, {
          duration: reducedMotion.matches ? 240 : 1800,
          easing: 'cubic-bezier(.45, 0, .2, 1)'
        }).finished, glow.finished]);
      } finally {
        spinning = false;
      }
    });
  </script>
</body>
</html>
